<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>citegraph extraction pipeline: PDFs to canonical works and citation graph</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1540" height="640" fill="#ffffff"/>

  <!-- ============ INPUT: stack of PDFs ============ -->
  <g stroke="#64748b" stroke-width="1.5" fill="#ffffff">
    <rect x="58" y="286" width="62" height="82" rx="4"/>
    <rect x="66" y="294" width="62" height="82" rx="4"/>
    <rect x="74" y="302" width="62" height="82" rx="4"/>
  </g>
  <text x="105" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">PDF</text>
  <text x="97" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Academic PDFs</text>
  <text x="97" y="430" text-anchor="middle" font-size="11" fill="#64748b">the user&#8217;s corpus</text>

  <line x1="142" y1="342" x2="188" y2="342" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============ STAGE 1: PDF conversion ============ -->
  <rect x="200" y="285" width="190" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="295" y="323" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">PDF conversion</text>
  <text x="295" y="346" text-anchor="middle" font-size="12" fill="#64748b" font-family="Menlo, Consolas, monospace">docling</text>
  <rect x="243" y="359" width="104" height="22" rx="11" fill="#e2e8f0"/>
  <text x="295" y="374" text-anchor="middle" font-size="11" fill="#334155">deterministic</text>
  <circle cx="200" cy="285" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="200" y="289.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">1</text>

  <line x1="390" y1="342" x2="434" y2="342" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============ ARTIFACT: markdown ============ -->
  <rect x="445" y="300" width="60" height="80" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="453" y1="316" x2="497" y2="316"/>
    <line x1="453" y1="330" x2="489" y2="330"/>
    <line x1="453" y1="344" x2="497" y2="344"/>
    <line x1="453" y1="358" x2="485" y2="358"/>
  </g>
  <text x="475" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">markdown</text>
  <text x="475" y="422" text-anchor="middle" font-size="11" fill="#64748b">one file per paper</text>

  <!-- fork arrows -->
  <line x1="509" y1="318" x2="600" y2="198" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="509" y1="364" x2="600" y2="482" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============ STAGE 2: metadata extraction (LLM) ============ -->
  <rect x="610" y="120" width="220" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Metadata extraction</text>
  <text x="720" y="181" text-anchor="middle" font-size="12.5" fill="#64748b">reads the full text</text>
  <rect x="645" y="194" width="150" height="22" rx="11" fill="#2563eb"/>
  <text x="720" y="209" text-anchor="middle" font-size="11" fill="#ffffff">LLM &#183; structured output</text>
  <circle cx="610" cy="120" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="610" y="124.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">2</text>

  <!-- ============ STAGE 3: reference extraction (LLM) ============ -->
  <rect x="610" y="450" width="220" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="488" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Reference extraction</text>
  <text x="720" y="511" text-anchor="middle" font-size="12.5" fill="#64748b">reads bibliography sections</text>
  <rect x="645" y="524" width="150" height="22" rx="11" fill="#2563eb"/>
  <text x="720" y="539" text-anchor="middle" font-size="11" fill="#ffffff">LLM &#183; structured output</text>
  <circle cx="610" cy="450" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="610" y="454.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">3</text>

  <line x1="830" y1="175" x2="876" y2="175" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="830" y1="505" x2="876" y2="505" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============ ARTIFACT: source works ============ -->
  <rect x="882" y="140" width="96" height="70" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="892" y1="156" x2="968" y2="156"/>
    <line x1="892" y1="170" x2="956" y2="170"/>
    <line x1="892" y1="184" x2="968" y2="184"/>
    <line x1="892" y1="198" x2="948" y2="198"/>
  </g>
  <text x="930" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">source works</text>
  <text x="930" y="252" text-anchor="middle" font-size="10.5" fill="#64748b">title &#183; authors &#183; journal &#183; year</text>
  <text x="930" y="269" text-anchor="middle" font-size="10.5" fill="#64748b">one row per PDF</text>

  <!-- ============ ARTIFACT: raw citations ============ -->
  <rect x="882" y="470" width="96" height="70" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="892" y1="486" x2="968" y2="486"/>
    <line x1="892" y1="500" x2="956" y2="500"/>
    <line x1="892" y1="514" x2="968" y2="514"/>
    <line x1="892" y1="528" x2="948" y2="528"/>
  </g>
  <text x="930" y="564" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">raw citations</text>
  <text x="930" y="582" text-anchor="middle" font-size="10.5" fill="#64748b">title &#183; authors &#183; journal &#183; year</text>
  <text x="930" y="599" text-anchor="middle" font-size="10.5" fill="#64748b">one row per occurrence</text>

  <!-- merge elbows into stage 4 -->
  <path d="M982,175 H1008 Q1016,175 1016,183 V310 Q1016,318 1024,318 H1040" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M982,505 H1008 Q1016,505 1016,497 V370 Q1016,362 1024,362 H1040" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============ STAGE 4: canonicalization ============ -->
  <rect x="1050" y="280" width="220" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1160" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Canonicalization</text>
  <text x="1160" y="339" text-anchor="middle" font-size="12.5" fill="#64748b">fuzzy clustering of sources</text>
  <text x="1160" y="356" text-anchor="middle" font-size="12.5" fill="#64748b">and citations, jointly</text>
  <rect x="1108" y="368" width="104" height="22" rx="11" fill="#e2e8f0"/>
  <text x="1160" y="383" text-anchor="middle" font-size="11" fill="#334155">deterministic</text>
  <circle cx="1050" cy="280" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1050" y="284.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">4</text>

  <line x1="1270" y1="340" x2="1314" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============ OUTPUT: citation graph ============ -->
  <!-- edges (citing -> cited) -->
  <g stroke="#64748b" stroke-width="1.6">
    <line x1="1367" y1="278" x2="1353" y2="217" marker-end="url(#arrS)"/> <!-- A->D -->
    <line x1="1436" y1="247" x2="1358" y2="211" marker-end="url(#arrS)"/> <!-- B->D -->
    <line x1="1455" y1="264" x2="1487" y2="292" marker-end="url(#arrS)"/> <!-- B->E -->
    <line x1="1408" y1="379" x2="1362" y2="418" marker-end="url(#arrS)"/> <!-- C->F -->
    <line x1="1424" y1="380" x2="1464" y2="411" marker-end="url(#arrS)"/> <!-- C->G -->
    <line x1="1425" y1="361" x2="1487" y2="307" marker-end="url(#arrS)"/> <!-- C->E -->
    <line x1="1381" y1="285" x2="1432" y2="261" marker-end="url(#arrS)"/> <!-- A->B -->
  </g>

  <!-- nodes -->
  <g fill="#1e293b">
    <circle cx="1370" cy="290" r="10"/>
    <circle cx="1445" cy="255" r="10"/>
    <circle cx="1415" cy="370" r="10"/>
    <circle cx="1350" cy="205" r="10"/>
    <circle cx="1495" cy="300" r="10"/>
    <circle cx="1355" cy="425" r="10"/>
    <circle cx="1470" cy="420" r="10"/>
  </g>

  <text x="1412" y="474" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">citation graph</text>
  <text x="1412" y="492" text-anchor="middle" font-size="10.5" fill="#64748b">one node per canonical work</text>
</svg>
