<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>What a supervision tie records, and how unevenly the two levels are observed: an advisor is identified for 44 of 56 doctorates but only 6 of 22 postdoc positions</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="620" fill="#ffffff"/>

  <!-- ================= PANEL HEADERS ================= -->
  <circle cx="58" cy="52" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="58" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">A</text>
  <text x="82" y="57" font-size="16" font-weight="bold" fill="#1e293b">What one tie records</text>
  <text x="82" y="78" font-size="11.5" fill="#64748b">supervision.csv holds one row per tie, for a single level</text>

  <circle cx="898" cy="52" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="898" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">B</text>
  <text x="922" y="57" font-size="16" font-weight="bold" fill="#1e293b">How much of it we see</text>
  <text x="922" y="78" font-size="11.5" fill="#64748b">the lineage covers doctorates only, by decision</text>

  <line x1="860" y1="100" x2="860" y2="580" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= PANEL A ================= -->
  <line x1="306" y1="170" x2="534" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="420" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">phd</text>
  <circle cx="280" cy="170" r="22" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <circle cx="560" cy="170" r="22" fill="#2563eb"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">advisor</text>
  <text x="280" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">often outside the 59</text>
  <text x="560" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">advisee</text>
  <text x="560" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">always one of the 59</text>

  <rect x="100" y="266" width="640" height="246" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="122" y="294" font-size="12.5" font-weight="bold" fill="#1e293b">supervision.csv &#8212; one row per tie</text>
  <line x1="122" y1="306" x2="718" y2="306" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="11" font-weight="600" fill="#334155">
    <text x="122" y="330">advisor / advisee</text>
    <text x="122" y="356">relation_type</text>
    <text x="122" y="382">institution</text>
    <text x="122" y="408">year_start / year_end</text>
    <text x="122" y="434">confidence</text>
    <text x="122" y="460">evidence</text>
    <text x="122" y="486">advisor_in_corpus</text>
  </g>
  <g font-size="11" fill="#64748b">
    <text x="300" y="330">the two people, resolved to author_id where known</text>
    <text x="300" y="356">phd 62 &#8212; the only level modelled</text>
    <text x="300" y="382">where the training happened, ROR-resolved</text>
    <text x="300" y="408">when</text>
    <text x="300" y="434">high 62 &#8212; every tie</text>
    <text x="300" y="460">the source that establishes the tie</text>
    <text x="300" y="486">false for 42 of 62 ties</text>
  </g>

  <text x="420" y="556" text-anchor="middle" font-size="11.5" fill="#64748b">Parking the postdoc layer removed every uncertain tie: all 62 that remain are high-confidence.</text>

  <!-- ================= PANEL B ================= -->
  <rect x="1000" y="118" width="22" height="12" fill="#e2e8f0"/>
  <text x="1030" y="128" font-size="10.5" fill="#64748b">recorded positions</text>
  <rect x="1160" y="118" width="22" height="12" fill="#2563eb"/>
  <text x="1190" y="128" font-size="10.5" fill="#64748b">advisor identified</text>

  <text x="1000" y="166" font-size="12" font-weight="600" fill="#1e293b">PhD</text>
  <rect x="1000" y="176" width="560" height="34" fill="#e2e8f0"/>
  <rect x="1000" y="176" width="440" height="34" fill="#2563eb"/>
  <text x="1014" y="198" font-size="11.5" font-weight="600" fill="#ffffff">44 of 56 doctorates &#183; 79%</text>

  <text x="1000" y="236" font-size="12" font-weight="600" fill="#1e293b">Postdoc</text>
  <rect x="1000" y="246" width="220" height="34" fill="#e2e8f0"/>
  <text x="1234" y="268" font-size="11.5" font-weight="600" fill="#1e293b">22 positions recorded, no ties modelled</text>

  <text x="1000" y="306" font-size="12" font-weight="600" fill="#1e293b">Visiting</text>
  <rect x="1000" y="316" width="30" height="34" fill="#e2e8f0"/>
  <text x="1044" y="338" font-size="11.5" font-weight="600" fill="#1e293b">3 positions recorded, no ties modelled</text>

  <text x="1000" y="378" font-size="10" fill="#94a3b8">Bar length is proportional to recorded positions, so the three levels are comparable in size as well as in coverage.</text>

  <rect x="1000" y="410" width="560" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="1022" y="436" font-size="11" fill="#64748b">PhD advisors come from the spreadsheet&#8217;s own column.</text>
  <text x="1022" y="456" font-size="11" fill="#64748b">Postdoc and visiting supervision was researched &#8212; seven ties</text>
  <text x="1022" y="476" font-size="11" fill="#64748b">&#8212; then parked on 12 September 2026. The positions stay in</text>
  <text x="1022" y="496" font-size="11" fill="#64748b">career_positions.csv; the ties are not modelled.</text>

  <rect x="1100" y="537" width="340" height="26" rx="13" fill="#e2e8f0"/>
  <text x="1270" y="554" text-anchor="middle" font-size="11.5" fill="#334155">the network is a PhD lineage, by decision</text>
</svg>
