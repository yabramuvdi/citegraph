<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The author co-citation projection: a bipartite graph of citing works and cited authors collapses to a weighted one-mode network over authors</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="750" fill="#ffffff"/>

  <!-- ================= PANEL HEADERS ================= -->
  <circle cx="58" cy="52" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="58" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">A</text>
  <text x="82" y="57" font-size="16" font-weight="bold" fill="#1e293b">The bipartite view</text>
  <text x="82" y="78" font-size="11.5" fill="#64748b">citing works on one side, the authors they cite on the other</text>

  <circle cx="902" cy="52" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="902" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">B</text>
  <text x="926" y="57" font-size="16" font-weight="bold" fill="#1e293b">The one-mode projection</text>
  <text x="926" y="78" font-size="11.5" fill="#64748b">two authors are joined when one citing work names both; the weight counts how many do</text>

  <line x1="866" y1="100" x2="866" y2="600" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= PANEL A: bipartite ================= -->
  <text x="180" y="118" text-anchor="middle" font-size="9.5" letter-spacing="0.8" fill="#94a3b8">CITING WORKS</text>
  <text x="600" y="118" text-anchor="middle" font-size="9.5" letter-spacing="0.8" fill="#94a3b8">CITED AUTHORS</text>

  <!-- membership edges: authors ordered so that Ostrom, cited by all three,
       sits mid-column and the fan stays readable -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <line x1="212" y1="240" x2="582" y2="150"/>
    <line x1="212" y1="240" x2="582" y2="250"/>
    <line x1="212" y1="240" x2="582" y2="350"/>
    <line x1="212" y1="340" x2="582" y2="250"/>
    <line x1="212" y1="340" x2="582" y2="450"/>
    <line x1="212" y1="440" x2="582" y2="350"/>
    <line x1="212" y1="440" x2="582" y2="450"/>
    <line x1="212" y1="440" x2="582" y2="550"/>
    <!-- B2 cites two Ostrom works: two reference entries, one author node -->
    <line x1="212" y1="330" x2="582" y2="350"/>
    <line x1="212" y1="350" x2="582" y2="350"/>
  </g>

  <!-- citing works -->
  <g>
    <rect x="152" y="212" width="56" height="56" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="180" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">B1</text>
    <rect x="152" y="312" width="56" height="56" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="180" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">B2</text>
    <rect x="152" y="412" width="56" height="56" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="180" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">B3</text>
  </g>

  <!-- the "two works, one mention" note, sitting on the isolated B2-Ostrom pair -->
  <rect x="321" y="334" width="118" height="22" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="380" y="349" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">2 works &#8594; 1 mention</text>

  <!-- cited authors -->
  <g fill="#2563eb">
    <circle cx="600" cy="150" r="18"/>
    <circle cx="600" cy="250" r="18"/>
    <circle cx="600" cy="350" r="18"/>
    <circle cx="600" cy="450" r="18"/>
    <circle cx="600" cy="550" r="18"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1e293b">
    <text x="628" y="155">Tversky</text>
    <text x="628" y="255">Fehr</text>
    <text x="628" y="355">Ostrom</text>
    <text x="628" y="455">Bowles</text>
    <text x="628" y="555">C&#225;rdenas</text>
  </g>

  <!-- projection arrow -->
  <line x1="740" y1="380" x2="846" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="793" y="366" text-anchor="middle" font-size="10.5" letter-spacing="0.4" fill="#94a3b8">project</text>

  <!-- ================= PANEL B: one-mode projection ================= -->
  <g stroke="#64748b">
    <line x1="1270" y1="360" x2="1120" y2="265" stroke-width="7"/>
    <line x1="1270" y1="360" x2="1450" y2="300" stroke-width="7"/>
    <line x1="1270" y1="360" x2="1095" y2="470" stroke-width="3"/>
    <line x1="1120" y1="265" x2="1095" y2="470" stroke-width="3"/>
    <line x1="1120" y1="265" x2="1450" y2="300" stroke-width="3"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 5">
    <line x1="1270" y1="360" x2="1390" y2="515"/>
    <line x1="1450" y1="300" x2="1390" y2="515"/>
  </g>

  <g fill="#2563eb">
    <circle cx="1270" cy="360" r="20"/>
    <circle cx="1120" cy="265" r="20"/>
    <circle cx="1095" cy="470" r="20"/>
    <circle cx="1450" cy="300" r="20"/>
  </g>
  <circle cx="1390" cy="515" r="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- edge weights -->
  <g>
    <circle cx="1195" cy="312" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <text x="1195" y="316" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e293b">2</text>
    <circle cx="1360" cy="330" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <text x="1360" y="334" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e293b">2</text>
    <circle cx="1182" cy="415" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <text x="1182" y="419" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e293b">1</text>
    <circle cx="1107" cy="367" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <text x="1107" y="371" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e293b">1</text>
    <circle cx="1235" cy="277" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <text x="1235" y="281" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e293b">1</text>
  </g>

  <g font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">
    <text x="1270" y="326">Ostrom</text>
    <text x="1120" y="231">Fehr</text>
    <text x="1095" y="516">Tversky</text>
    <text x="1450" y="266">Bowles</text>
  </g>
  <text x="1390" y="561" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">C&#225;rdenas</text>

  <!-- ================= RULE CARDS ================= -->
  <rect x="60" y="630" width="500" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25"/>
  <circle cx="86" cy="656" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="86" y="660" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="108" y="660" font-size="12.5" font-weight="bold" fill="#1e293b">One mention per citing work</text>
  <text x="86" y="686" font-size="11" fill="#64748b">B2 lists two Ostrom papers, but Ostrom counts once. The tie is</text>
  <text x="86" y="704" font-size="11" fill="#64748b">between authors, not between reference-list entries.</text>

  <rect x="590" y="630" width="500" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25"/>
  <circle cx="616" cy="656" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="616" y="660" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">2</text>
  <text x="638" y="660" font-size="12.5" font-weight="bold" fill="#1e293b">No self-loops</text>
  <text x="616" y="686" font-size="11" fill="#64748b">An author is never joined to themselves, however many of their</text>
  <text x="616" y="704" font-size="11" fill="#64748b">works a single bibliography happens to cite.</text>

  <rect x="1120" y="630" width="500" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25"/>
  <circle cx="1146" cy="656" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="1146" y="660" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">3</text>
  <text x="1168" y="660" font-size="12.5" font-weight="bold" fill="#1e293b">min_papers prunes the tail</text>
  <text x="1146" y="686" font-size="11" fill="#64748b">C&#225;rdenas is named by one bibliography only, so min_papers = 2</text>
  <text x="1146" y="704" font-size="11" fill="#64748b">drops the node before the network is returned.</text>
</svg>
