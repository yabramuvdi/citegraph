<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>How an author co-citation network is built: bibliographies join every pair of authors they cite, and the tie weight counts how many bibliographies do so</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="620" fill="#ffffff"/>

  <!-- ================= PANEL HEADERS ================= -->
  <circle cx="58" cy="52" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="58" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">A</text>
  <text x="82" y="57" font-size="16" font-weight="bold" fill="#1e293b">Bibliographies</text>
  <text x="82" y="78" font-size="11.5" fill="#64748b">each processed PDF contributes one reference list</text>

  <circle cx="578" cy="52" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="578" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">B</text>
  <text x="602" y="57" font-size="16" font-weight="bold" fill="#1e293b">One bibliography makes ties</text>
  <text x="602" y="78" font-size="11.5" fill="#64748b">every pair of authors it cites is joined</text>

  <circle cx="1098" cy="52" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1098" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">C</text>
  <text x="1122" y="57" font-size="16" font-weight="bold" fill="#1e293b">Accumulate across bibliographies</text>
  <text x="1122" y="78" font-size="11.5" fill="#64748b">the tie weight counts how many cite both</text>

  <line x1="540" y1="100" x2="540" y2="540" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="1060" y1="100" x2="1060" y2="540" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= PANEL A: three bibliography cards ================= -->

  <!-- B1 -->
  <rect x="120" y="110" width="320" height="116" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="138" y="134" font-size="12" font-weight="bold" fill="#1e293b">B1</text>
  <text x="422" y="134" text-anchor="end" font-size="9.5" letter-spacing="0.8" fill="#94a3b8">REFERENCES</text>
  <line x1="138" y1="152" x2="422" y2="152" stroke="#e2e8f0" stroke-width="1"/>
  <text x="138" y="174" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Ostrom</tspan><tspan fill="#64748b">, E. (1990).</tspan></text>
  <text x="138" y="194" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Fehr</tspan><tspan fill="#64748b">, E. (2002).</tspan></text>
  <text x="138" y="214" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Tversky</tspan><tspan fill="#64748b">, A. (1974).</tspan></text>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="282" y1="170" x2="422" y2="170"/>
    <line x1="282" y1="190" x2="410" y2="190"/>
    <line x1="282" y1="210" x2="422" y2="210"/>
  </g>

  <!-- B2 -->
  <rect x="120" y="246" width="320" height="136" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="138" y="270" font-size="12" font-weight="bold" fill="#1e293b">B2</text>
  <text x="422" y="270" text-anchor="end" font-size="9.5" letter-spacing="0.8" fill="#94a3b8">REFERENCES</text>
  <line x1="138" y1="288" x2="422" y2="288" stroke="#e2e8f0" stroke-width="1"/>
  <text x="138" y="310" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Ostrom</tspan><tspan fill="#64748b">, E. (1990).</tspan></text>
  <text x="138" y="330" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Ostrom</tspan><tspan fill="#64748b">, E. (2000).</tspan></text>
  <text x="138" y="350" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Fehr</tspan><tspan fill="#64748b">, E. (2002).</tspan></text>
  <text x="138" y="370" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Bowles</tspan><tspan fill="#64748b">, S. (1998).</tspan></text>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="282" y1="306" x2="422" y2="306"/>
    <line x1="282" y1="326" x2="414" y2="326"/>
    <line x1="282" y1="346" x2="422" y2="346"/>
    <line x1="282" y1="366" x2="404" y2="366"/>
  </g>

  <!-- B3 -->
  <rect x="120" y="402" width="320" height="116" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="138" y="426" font-size="12" font-weight="bold" fill="#1e293b">B3</text>
  <text x="422" y="426" text-anchor="end" font-size="9.5" letter-spacing="0.8" fill="#94a3b8">REFERENCES</text>
  <line x1="138" y1="444" x2="422" y2="444" stroke="#e2e8f0" stroke-width="1"/>
  <text x="138" y="466" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Ostrom</tspan><tspan fill="#64748b">, E. (2010).</tspan></text>
  <text x="138" y="486" font-size="11.5"><tspan font-weight="600" fill="#2563eb">Bowles</tspan><tspan fill="#64748b">, S. (1998).</tspan></text>
  <text x="138" y="506" font-size="11.5"><tspan font-weight="600" fill="#2563eb">C&#225;rdenas</tspan><tspan fill="#64748b">, J.C. (2003).</tspan></text>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="282" y1="462" x2="422" y2="462"/>
    <line x1="282" y1="482" x2="408" y2="482"/>
    <line x1="282" y1="502" x2="422" y2="502"/>
  </g>

  <text x="280" y="560" text-anchor="middle" font-size="11.5" fill="#64748b">Surnames in blue are the author occurrences the network</text>
  <text x="280" y="578" text-anchor="middle" font-size="11.5" fill="#64748b">is built from &#8212; one mention per author, per bibliography.</text>

  <!-- ================= PANEL B: one bibliography -> a clique ================= -->

  <rect x="680" y="110" width="240" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="136" font-size="12" font-weight="bold" fill="#1e293b">B1</text>
  <text x="722" y="136" font-size="10.5" fill="#94a3b8">cites</text>
  <g>
    <rect x="700" y="152" width="64" height="24" rx="12" fill="#2563eb"/>
    <text x="732" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Ostrom</text>
    <rect x="772" y="152" width="50" height="24" rx="12" fill="#2563eb"/>
    <text x="797" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Fehr</text>
    <rect x="830" y="152" width="71" height="24" rx="12" fill="#2563eb"/>
    <text x="865" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Tversky</text>
  </g>

  <line x1="800" y1="190" x2="800" y2="238" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <g stroke="#64748b" stroke-width="3">
    <line x1="800" y1="300" x2="712" y2="452"/>
    <line x1="800" y1="300" x2="888" y2="452"/>
    <line x1="712" y1="452" x2="888" y2="452"/>
  </g>
  <g fill="#2563eb">
    <circle cx="800" cy="300" r="20"/>
    <circle cx="712" cy="452" r="20"/>
    <circle cx="888" cy="452" r="20"/>
  </g>
  <text x="800" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Ostrom</text>
  <text x="712" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Fehr</text>
  <text x="888" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Tversky</text>

  <text x="800" y="560" text-anchor="middle" font-size="11.5" fill="#64748b">B1 names three authors, so three ties form, each of weight 1.</text>
  <text x="800" y="578" text-anchor="middle" font-size="11.5" fill="#64748b">A bibliography naming k authors contributes k(k&#8722;1)/2 ties.</text>

  <!-- ================= PANEL C: weighted network ================= -->

  <text x="1096" y="128" font-size="9.5" letter-spacing="0.8" fill="#94a3b8">TIE WEIGHT</text>
  <line x1="1096" y1="148" x2="1136" y2="148" stroke="#64748b" stroke-width="3"/>
  <text x="1146" y="152" font-size="10.5" fill="#64748b">1 bibliography cites both</text>
  <line x1="1096" y1="174" x2="1136" y2="174" stroke="#64748b" stroke-width="7"/>
  <text x="1146" y="178" font-size="10.5" fill="#64748b">2 bibliographies cite both</text>

  <g stroke="#64748b">
    <line x1="1370" y1="340" x2="1212" y2="252" stroke-width="7"/>
    <line x1="1370" y1="340" x2="1538" y2="292" stroke-width="7"/>
    <line x1="1370" y1="340" x2="1192" y2="432" stroke-width="3"/>
    <line x1="1370" y1="340" x2="1478" y2="477" stroke-width="3"/>
    <line x1="1212" y1="252" x2="1192" y2="432" stroke-width="3"/>
    <line x1="1212" y1="252" x2="1538" y2="292" stroke-width="3"/>
    <line x1="1538" y1="292" x2="1478" y2="477" stroke-width="3"/>
  </g>
  <g fill="#2563eb">
    <circle cx="1370" cy="340" r="20"/>
    <circle cx="1212" cy="252" r="20"/>
    <circle cx="1192" cy="432" r="20"/>
    <circle cx="1538" cy="292" r="20"/>
    <circle cx="1478" cy="477" r="20"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">
    <text x="1370" y="308">Ostrom</text>
    <text x="1212" y="220">Fehr</text>
    <text x="1192" y="478">Tversky</text>
    <text x="1538" y="260">Bowles</text>
    <text x="1478" y="523">C&#225;rdenas</text>
  </g>

  <text x="1370" y="560" text-anchor="middle" font-size="11.5" fill="#64748b">Ties are undirected: Ostrom and Fehr need never have cited</text>
  <text x="1370" y="578" text-anchor="middle" font-size="11.5" fill="#64748b">each other, or ever met &#8212; a third party joined them.</text>
</svg>
