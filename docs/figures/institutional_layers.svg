<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Two layers over the same people: authors joined by co-citation, and the same authors joined by hand-collected supervision ties, linked by the same author id</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="600" fill="#ffffff"/>

  <!-- ================= BAND LABELS ================= -->
  <circle cx="58" cy="150" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="58" y="154.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">A</text>
  <text x="82" y="155" font-size="16" font-weight="bold" fill="#1e293b">Co-citation layer</text>
  <text x="58" y="182" font-size="11.5" fill="#64748b">from the bibliographies &#8212;</text>
  <text x="58" y="200" font-size="11.5" fill="#64748b">who is cited together</text>

  <circle cx="58" cy="415" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="58" y="419.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">B</text>
  <text x="82" y="420" font-size="16" font-weight="bold" fill="#1e293b">Institutional layer</text>
  <text x="58" y="447" font-size="11.5" fill="#64748b">hand-collected careers &#8212;</text>
  <text x="58" y="465" font-size="11.5" fill="#64748b">who trained whom, and where</text>

  <!-- ================= BAND A: co-citation arcs ================= -->
  <g fill="none" stroke="#64748b">
    <path d="M470,210 Q535,141 600,210" stroke-width="6"/>
    <path d="M600,210 Q730,113 860,210" stroke-width="6"/>
    <path d="M860,210 Q975,119 1090,210" stroke-width="6"/>
    <path d="M470,210 Q665,84 860,210" stroke-width="3"/>
    <path d="M860,210 Q1045,89 1230,210" stroke-width="3"/>
    <path d="M1090,210 Q1160,139 1230,210" stroke-width="3"/>
    <path d="M600,210 Q650,148 700,210" stroke-width="3"/>
    <path d="M700,210 Q780,135 860,210" stroke-width="3"/>
    <path d="M990,210 Q1040,148 1090,210" stroke-width="3"/>
  </g>

  <!-- authors below the inclusion threshold -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.6">
    <circle cx="700" cy="210" r="11"/>
    <circle cx="990" cy="210" r="11"/>
  </g>

  <!-- prominent authors, carried forward into the career base -->
  <g fill="#2563eb">
    <circle cx="470" cy="210" r="18"/>
    <circle cx="600" cy="210" r="18"/>
    <circle cx="860" cy="210" r="18"/>
    <circle cx="1090" cy="210" r="18"/>
    <circle cx="1230" cy="210" r="18"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="470" y="215">A</text>
    <text x="600" y="215">B</text>
    <text x="860" y="215">C</text>
    <text x="1090" y="215">D</text>
    <text x="1230" y="215">E</text>
  </g>

  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="990" y="262">not an author of the core</text>
    <text x="990" y="280">corpus, so no career</text>
    <text x="990" y="298">record was collected</text>
  </g>

  <!-- ================= RISERS: the author_id join ================= -->
  <g stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 4">
    <line x1="470" y1="228" x2="470" y2="337"/>
    <line x1="600" y1="228" x2="600" y2="407"/>
    <line x1="860" y1="228" x2="860" y2="472"/>
    <line x1="1090" y1="228" x2="1090" y2="407"/>
    <line x1="1230" y1="228" x2="1230" y2="407"/>
  </g>
  <text x="1290" y="268" font-size="10.5" fill="#94a3b8">joined on author_id,</text>
  <text x="1290" y="286" font-size="10.5" fill="#94a3b8">never on the name string</text>

  <!-- ================= BAND B: supervision lineage ================= -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="352" y1="305" x2="453" y2="348" marker-end="url(#arr)"/>
    <line x1="486" y1="363" x2="584" y2="417" marker-end="url(#arr)"/>
    <line x1="617" y1="429" x2="841" y2="485" marker-end="url(#arr)"/>
    <line x1="1073" y1="430" x2="877" y2="485" marker-end="url(#arr)"/>
  </g>

  <!-- an advisor who is not one of the 59 -->
  <circle cx="340" cy="300" r="13" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="340" y="256">advisors are often outside</text>
    <text x="340" y="272">the 59 (49 of 62 ties)</text>
  </g>

  <g fill="#2563eb">
    <circle cx="470" cy="355" r="18"/>
    <circle cx="600" cy="425" r="18"/>
    <circle cx="860" cy="490" r="18"/>
    <circle cx="1090" cy="425" r="18"/>
    <circle cx="1230" cy="425" r="18"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="470" y="360">A</text>
    <text x="600" y="430">B</text>
    <text x="860" y="495">C</text>
    <text x="1090" y="430">D</text>
    <text x="1230" y="430">E</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="1230" y="465">no advisor identified &#8212;</text>
    <text x="1230" y="481">12 of 56 doctorates</text>
  </g>

  <!-- legend -->
  <rect x="1330" y="345" width="292" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="1352" y="369" font-size="10" letter-spacing="0.8" fill="#94a3b8">SUPERVISION TIE</text>
  <line x1="1352" y1="391" x2="1392" y2="391" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1404" y="395" font-size="10.5" fill="#334155">PhD &#183; 62 ties, all high-confidence</text>
  <circle cx="1362" cy="417" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="1404" y="421" font-size="10.5" fill="#334155">advisor outside the 59 (49 of 62)</text>
  <line x1="1352" y1="439" x2="1600" y2="439" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1352" y="459" font-size="10.5" fill="#64748b">Postdoc and visiting appointments are</text>
  <text x="1352" y="475" font-size="10.5" fill="#64748b">kept as career positions but are not</text>
  <text x="1352" y="491" font-size="10.5" fill="#64748b">modelled as supervision ties.</text>
  <text x="1352" y="515" font-size="10.5" fill="#64748b">Each position resolves to a ROR id.</text>

  <text x="840" y="550" text-anchor="middle" font-size="11.5" fill="#64748b">52 of the 553 authors in the co-citation network have a career record; 7 more have one but are cited too rarely to be nodes. C has two advisors: 14 of 44 doctorates are co-supervised.</text>
  <text x="840" y="568" text-anchor="middle" font-size="11.5" fill="#64748b">Both layers describe the same people, so every join runs on author_id.</text>
</svg>
